<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- NOINDEX: keeps the site out of search engines. Delete the next line when ready to be indexed. -->
  <meta name="robots" content="noindex">
  <title>Jeffery Liu | Contact</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #0F1216;
      --panel:     #171B21;
      --hairline:  #2A2F37;
      --text:      #E8EAED;
      --muted:     #9BA1A9;
      --navy:      #1F3864;
      --accent:    #E0A24A;
      --maxw: 1200px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Hanken Grotesk", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    .topbar { border-bottom: 1px solid var(--hairline); }
    .topbar-inner {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 22px 32px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
    }
    .wordmark {
      font-family: "Archivo", sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.02em;
    }
    .nav {
      display: flex;
      gap: 28px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      color: var(--muted);
    }
    .nav a:hover { color: var(--text); }
    .nav a.active { color: var(--text); }

    /* Fills the height left under the topbar and splits the spare space 2:3
       around the content, so the block sits at an optical ~40%, not dead centre.
       With no spare height (short viewports) the spacers collapse to zero and
       the content top-aligns below the nav; min-height means it is never clipped. */
    .page-body {
      width: 100%;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }
    .page-body::before { content: ""; flex: 2 0 0; }
    .page-body::after  { content: ""; flex: 3 0 0; }

    .page-head {
      max-width: var(--maxw);
      width: 100%;
      margin: 0 auto;
      padding: 56px 32px 0;
    }
    .page-kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 14px;
    }
    .page-title {
      font-family: "Archivo", sans-serif;
      font-weight: 700;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.05;
      margin: 0;
      letter-spacing: -0.01em;
    }

    /* contact rows: mono label + plain value */
    .contact-list {
      max-width: var(--maxw);
      width: 100%;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }
    .contact-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      padding: 18px 0;
      border-top: 1px solid var(--hairline);
      align-items: baseline;
    }
    .contact-row:last-child { border-bottom: 1px solid var(--hairline); }
    .contact-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .contact-value {
      font-size: 17px;
      color: var(--text);
    }
    .contact-value a:hover { color: var(--accent); }

    @media (max-width: 560px) {
      .contact-row { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>

  <link rel="stylesheet" href="motion.css">
  <script src="motion.js" defer></script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="index.html">JEFFERY LIU</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="cv.html">CV</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-body">

  <section class="page-head">
    <p class="page-kicker">Get in touch</p>
    <h1 class="page-title">Contact</h1>
  </section>

  <div class="contact-list">
    <div class="contact-row">
      <span class="contact-label">Location</span>
      <span class="contact-value">Christchurch, NZ</span>
    </div>
    <div class="contact-row">
      <span class="contact-label">Phone</span>
      <span class="contact-value"><a href="tel:+64210405166">021 040 5166</a></span>
    </div>
    <div class="contact-row">
      <span class="contact-label">Email</span>
      <span class="contact-value"><a href="mailto:jefferyliu33@gmail.com">jefferyliu33@gmail.com</a></span>
    </div>
    <div class="contact-row">
      <span class="contact-label">LinkedIn</span>
      <span class="contact-value"><a href="https://www.linkedin.com/in/jeffery-liu-aa1611359/" target="_blank" rel="noopener">linkedin.com/in/jeffery-liu-aa1611359</a></span>
    </div>
  </div>

  </main>

</body>
</html>
